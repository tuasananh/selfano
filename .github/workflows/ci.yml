name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene & Purity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check src/core/ purity boundary
        run: |
          if grep -rnE --include='*.h' --include='*.hpp' --include='*.cpp' \
            '(#include\s*[<"](imgui|SDL|libremidi|emscripten)|steady_clock::now|system_clock::now|random_device)' \
            src/core/; then
            echo "::error::src/core/ must remain hardware- and UI-agnostic."
            exit 1
          fi

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check clang-format
        run: |
          find src tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | \
            xargs -0 clang-format --dry-run --Werror

  native:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev libpipewire-0.3-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libegl-dev libgl-dev libgbm-dev libdrm-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure Ninja on Windows
        if: runner.os == 'Windows'
        run: |
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

      - name: Setup ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: native-${{ matrix.name }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: .fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --preset native-release \
            -DSELFANO_WARNINGS_AS_ERRORS=ON \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.fetchcontent" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --preset native-release \
            -DSELFANO_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.fetchcontent" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          $fetchDir = "${{ github.workspace }}/.fetchcontent" -replace '\\', '/'
          cmake --preset native-release `
            -DSELFANO_WARNINGS_AS_ERRORS=ON `
            "-DFETCHCONTENT_BASE_DIR=$fetchDir"

      - name: Build
        run: cmake --build --preset native-release

      - name: Run Catch2 unit tests
        run: ctest --preset native-release --output-on-failure

      - name: Run headless GUI smoke tests (Linux)
        if: runner.os == 'Linux'
        run: |
          PROFILE_PATH="/tmp/selfano_smoke_profile.json"
          rm -f "$PROFILE_PATH"
          for tab in home autopilot warmup flashcards etude lessons companion srs ear devtools; do
            echo "Smoke testing tab: $tab"
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
              ./build/native-release/selfano --smoke-frames 5 --tab "$tab" --profile "$PROFILE_PATH"
          done
          test -s "$PROFILE_PATH"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            ./build/native-release/selfano --smoke-frames 5 --tab home --profile "$PROFILE_PATH"
          rm -f "$PROFILE_PATH"

  sanitizers:
    name: ASan + UBSan (Linux Debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev libpipewire-0.3-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libegl-dev libgl-dev libgbm-dev libdrm-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: sanitizers-linux

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: .fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure with ASan + UBSan
        run: |
          cmake --preset native-debug \
            -DSELFANO_WARNINGS_AS_ERRORS=ON \
            -DSELFANO_ENABLE_SANITIZERS=ON \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.fetchcontent" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build unit tests
        run: cmake --build --preset native-debug --target selfano_tests

      - name: Run Catch2 unit tests under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset native-debug --output-on-failure

  web:
    name: WebAssembly (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: .fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure web-release
        run: |
          emcmake cmake --preset web-release \
            -DSELFANO_WARNINGS_AS_ERRORS=ON \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.fetchcontent"

      - name: Build web-release
        run: cmake --build --preset web-release

      - name: Verify Emscripten output artifacts
        run: |
          for file in selfano.html selfano.js selfano.wasm selfano.data; do
            test -s "build/web-release/$file"
          done
          ls -lh build/web-release/selfano.{html,js,wasm,data}
