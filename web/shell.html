<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selfano — Piano Trainer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23007AFF'/%3E%3Crect x='11' y='15' width='12' height='34' rx='3' fill='%23FFFFFF'/%3E%3Crect x='26' y='15' width='12' height='34' rx='3' fill='%23FFFFFF'/%3E%3Crect x='41' y='15' width='12' height='34' rx='3' fill='%23FFFFFF'/%3E%3Crect x='19' y='15' width='9' height='21' rx='2' fill='%231D1D1F'/%3E%3Crect x='36' y='15' width='9' height='21' rx='2' fill='%231D1D1F'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, 0.86);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #007aff;
      --track: rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --card: rgba(36, 36, 40, 0.90);
        --text: #f5f5f7;
        --muted: #98989d;
        --accent: #0a84ff;
        --track: rgba(255, 255, 255, 0.12);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* SDL3 Emscripten requires strictly zero border and zero padding on the canvas. */
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      padding: 0;
      margin: 0;
      outline: none;
      background-color: var(--bg);
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background-color: var(--bg);
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.24s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #loading-emblem {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--accent), #005ecb);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 26px rgba(0, 122, 255, 0.25);
    }

    #loading-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    #loading-bar {
      width: 180px;
      height: 4px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
      position: relative;
    }

    #loading-bar::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      border-radius: 999px;
      background: var(--accent);
      animation: selfano-slide 1.15s ease-in-out infinite;
    }

    @keyframes selfano-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(340%); }
    }

    #loading-status {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div id="loading-emblem">
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="14" width="12" height="36" rx="3" fill="#ffffff"/>
        <rect x="26" y="14" width="12" height="36" rx="3" fill="#ffffff"/>
        <rect x="42" y="14" width="12" height="36" rx="3" fill="#ffffff"/>
        <rect x="18" y="14" width="10" height="22" rx="2" fill="#1d1d1f"/>
        <rect x="36" y="14" width="10" height="22" rx="2" fill="#1d1d1f"/>
      </svg>
    </div>
    <div id="loading-title">Selfano</div>
    <div id="loading-bar"></div>
    <div id="loading-status">Preparing studio...</div>
  </div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    (function () {
      var overlay = document.getElementById('loading-overlay');
      var statusEl = document.getElementById('loading-status');
      var canvasEl = document.getElementById('canvas');

      canvasEl.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
        if (overlay && statusEl) {
          overlay.classList.remove('hidden');
          statusEl.textContent = 'WebGL context lost. Reload page to restore.';
        }
      }, false);

      // Route Ctrl/Cmd + = / - / 0 to Selfano's crisp vector UI zoom instead of browser zoom.
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && !e.altKey) {
          if (e.key === '=' || e.key === '+' || e.key === '-' || e.key === '_' || e.key === '0') {
            e.preventDefault();
          }
        }
      }, { passive: false });

      window.Module = {
        canvas: canvasEl,
        setStatus: function (text) {
          if (!statusEl || !overlay) {
            return;
          }
          if (!text) {
            overlay.classList.add('hidden');
          } else {
            statusEl.textContent = text;
          }
        },
        onRuntimeInitialized: function () {
          if (overlay) {
            overlay.classList.add('hidden');
          }
          if (canvasEl) {
            canvasEl.focus();
          }
        }
      };
    })();
  </script>

  {{{ SCRIPT }}}
</body>
</html>
